<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BKT Messenger 💬</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        h2 { color: #4361ee; margin-bottom: 10px; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 20px; box-sizing: border-box; font-size: 1rem; outline: none; }
        button { width: 100%; padding: 12px; background: #4361ee; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 600; }
        button:hover { background: #3046bc; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>ยินดีต้อนรับ 💬</h2>
        <p>กรุณาตั้งชื่อเล่นเพื่อเข้าสู่ห้องสนทนา</p>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="ชื่อเล่นของคุณ..." required>
            <button type="submit">เข้าสู่ระบบ</button>
        </form>
    </div>
</body>
</html>
