<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Web Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        #chat-box { width: 100%; height: 300px; border: 1px solid #ccc; background: white; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 10px; padding: 5px; border-radius: 5px; background-color: #e1f5fe; }
        input[type="text"] { padding: 10px; width: 70%; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>

    <h2>ห้องสนทนากลุ่ม (Web Chat Application)</h2>
    
    <div>
        <label>ชื่อผู้ใช้: </label>
        <input type="text" id="username" placeholder="ใส่ชื่อของคุณที่นี่..." style="width: 30%; margin-bottom: 10px;">
    </div>

    <div id="chat-box"></div>

    <input type="text" id="message" placeholder="พิมพ์ข้อความ...">
    <button onclick="sendMessage()">ส่งข้อความ</button>

    <script>
        // เชื่อมต่อกับ Server
        const socket = io();

        // เมื่อรับข้อความจาก Server ให้นำมาแสดงผล
        socket.on('receive_message', function(data) {
            const chatBox = document.getElementById('chat-box');
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            messageElement.innerHTML = `<strong>${data.username}:</strong> ${data.message}`;
            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight; // เลื่อนจอลงอัตโนมัติ
        });

        // ฟังก์ชันส่งข้อความ
        function sendMessage() {
            const username = document.getElementById('username').value;
            const message = document.getElementById('message').value;

            if (username.trim() === '' || message.trim() === '') {
                alert('กรุณาใส่ชื่อและข้อความให้ครบถ้วน');
                return;
            }

            // ส่งข้อมูลไปยัง Server
            socket.emit('send_message', {
                'username': username,
                'message': message
            });

            // ล้างช่องใส่ข้อความ
            document.getElementById('message').value = '';
        }
    </script>
</body>
</html>
